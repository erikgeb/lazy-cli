name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript imagemagick ffmpeg rsync bats poppler-utils python3-pillow

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ghostscript imagemagick ffmpeg rsync bats-core poppler pillow

      - name: Run test suite
        run: make test
